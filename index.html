<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试使用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #e2e8f0;
            padding: 20px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 48px 36px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .warning-icon {
            font-size: 64px;
            margin-bottom: 24px;
            color: #f59e0b;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #f8fafc;
        }
        .desc {
            font-size: 16px;
            line-height: 1.75;
            color: #cbd5e1;
            margin-bottom: 28px;
        }
        .tip-box {
            background-color: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 14px;
            color: #fcd34d;
        }
        .footer-text {
            margin-top: 32px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="warning-icon">⚠️</div>
        <h1>本个人域名禁止传播</h1>
        <p class="desc">

                自己搭建测试作品仅供测试。
        </p>
        
        <div class="footer-text">© Personal Domain · All Rights Reserved</div>
    </div>
</body>
</html>
